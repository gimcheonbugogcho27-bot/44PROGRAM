<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI GALAXY - 서비스 이용 제한 안내</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Tech Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #0b0d19;
            overflow-x: hidden;
        }

        /* Glowing background orb animations */
        .glow-orb-1 {
            position: absolute;
            top: 15%;
            left: 10%;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.35) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            filter: blur(50px);
            animation: float 8s ease-in-out infinite alternate;
        }

        .glow-orb-2 {
            position: absolute;
            bottom: 15%;
            right: 10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.3) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            filter: blur(60px);
            animation: float 10s ease-in-out infinite alternate-reverse;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, -40px) scale(1.1); }
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(18, 22, 41, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        /* AI Star Pulse */
        .star-pulse {
            animation: pulseGlow 2.5s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.9; filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.6)); }
            50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 22px rgba(99, 102, 241, 0.9)); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative select-none">

    <div class="glow-orb-1"></div>
    <div class="glow-orb-2"></div>

    <main class="relative z-10 w-full max-w-lg my-6">
        <div class="glass-card rounded-3xl p-8 sm:p-10 text-center relative overflow-hidden">
            
            <!-- Top Alert Badge -->
            <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-red-500/10 border border-red-500/30 text-red-400 text-xs sm:text-sm font-semibold mb-8 tracking-wide">
                <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
                <i class="fa-solid font-bold fa-triangle-exclamation"></i>
                <span>서비스 이용이 제한됩니다</span>
            </div>

            <!-- Galaxy AI Graphic Icon -->
            <div class="flex justify-center mb-6">
                <div class="relative w-24 h-24 sm:w-28 sm:h-28 flex items-center justify-center rounded-2xl bg-gradient-to-tr from-indigo-900/60 via-purple-900/40 to-slate-900/80 border border-purple-500/30 shadow-2xl">
                    <i class="fa-solid fa-wand-magic-sparkles text-4xl sm:text-5xl text-purple-300 star-pulse"></i>
                </div>
            </div>

            <div class="space-y-3 mb-8">
                <p class="text-gray-200 text-base sm:text-lg font-medium leading-relaxed">
                    안녕하세요 저는 <span class="text-indigo-300 font-semibold">김지유님</span>의 <span class="text-purple-300 font-semibold">AI GALAXY</span>입니다.
                </p>
                <p class="text-gray-300 text-sm sm:text-base leading-relaxed">
                    서버다운으로 불편을드려 죄송합니다.
                </p>
                <p class="text-gray-300 text-sm sm:text-base leading-relaxed">
                    빠른시간안에 북구하겠습니다.
                </p>
            </div>

            <!-- Signature Divider & Signature Line -->
            <div class="pt-6 border-t border-white/10 mb-8">
                <p class="text-purple-400/90 text-sm tracking-wider font-semibold">
                    - 김지유GALAXY AI -
                </p>
            </div>

            <div class="space-y-3">
                <button onclick="openModal('identity')" class="w-full py-3 px-4 rounded-xl bg-indigo-600/30 hover:bg-indigo-600/50 border border-indigo-500/40 text-indigo-200 text-sm font-medium transition-all duration-300 flex items-center justify-between group active:scale-[0.98]">
                    <span class="flex items-center gap-2">
                        <i class="fa-regular fa-circle-question text-indigo-400 group-hover:rotate-12 transition-transform"></i>
                        <span>넌 누구야</span>
                    </span>
                    <i class="fa-solid fa-chevron-right text-xs text-indigo-400 opacity-60 group-hover:translate-x-1 transition-transform"></i>
                </button>

                <button onclick="openModal('schedule')" class="w-full py-3 px-4 rounded-xl bg-purple-600/30 hover:bg-purple-600/50 border border-purple-500/40 text-purple-200 text-sm font-medium transition-all duration-300 flex items-center justify-between group active:scale-[0.98]">
                    <span class="flex items-center gap-2">
                        <i class="fa-regular fa-clock text-purple-400 group-hover:rotate-12 transition-transform"></i>
                        <span>언제쯤 돌아와</span>
                    </span>
                    <i class="fa-solid fa-chevron-right text-xs text-purple-400 opacity-60 group-hover:translate-x-1 transition-transform"></i>
                </button>

                <button onclick="openModal('nashi')" class="w-full py-3 px-4 rounded-xl bg-pink-600/30 hover:bg-pink-600/50 border border-pink-500/40 text-pink-200 text-sm font-medium transition-all duration-300 flex items-center justify-between group active:scale-[0.98]">
                    <span class="flex items-center gap-2">
                        <i class="fa-regular fa-face-smile-wink text-pink-400 group-hover:rotate-12 transition-transform"></i>
                        <span>나시</span>
                    </span>
                    <i class="fa-solid fa-chevron-right text-xs text-pink-400 opacity-60 group-hover:translate-x-1 transition-transform"></i>
                </button>

                <button onclick="openModal('stone')" class="w-full py-3 px-4 rounded-xl bg-amber-600/30 hover:bg-amber-600/50 border border-amber-500/40 text-amber-200 text-sm font-medium transition-all duration-300 flex items-center justify-between group active:scale-[0.98]">
                    <span class="flex items-center gap-2">
                        <i class="fa-solid fa-gem text-amber-400 group-hover:rotate-12 transition-transform"></i>
                        <span>돌맹이</span>
                    </span>
                    <i class="fa-solid fa-chevron-right text-xs text-amber-400 opacity-60 group-hover:translate-x-1 transition-transform"></i>
                </button>

                <!-- Newly added 가오리 Button -->
                <button onclick="openModal('ray')" class="w-full py-3 px-4 rounded-xl bg-teal-600/30 hover:bg-teal-600/50 border border-teal-500/40 text-teal-200 text-sm font-medium transition-all duration-300 flex items-center justify-between group active:scale-[0.98]">
                    <span class="flex items-center gap-2">
                        <i class="fa-solid fa-water text-teal-400 group-hover:rotate-12 transition-transform"></i>
                        <span>가오리</span>
                    </span>
                    <i class="fa-solid fa-chevron-right text-xs text-teal-400 opacity-60 group-hover:translate-x-1 transition-transform"></i>
                </button>
            </div>

        </div>

        <div class="mt-6 text-center">
            <p class="text-xs text-slate-500 tracking-wide">
                SYSTEM STATUS: <span class="text-amber-400 font-medium">UNDER MAINTENANCE</span>
            </p>
        </div>
    </main>

    <div id="responseModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="modalCard" class="glass-card rounded-2xl p-6 sm:p-8 w-full max-w-sm text-center transform scale-95 transition-transform duration-300 border border-purple-500/30">
            <div id="modalIcon" class="w-12 h-12 rounded-full mx-auto mb-4 flex items-center justify-center bg-indigo-500/20 text-indigo-300 text-xl border border-indigo-500/40">
                <i class="fa-solid fa-robot"></i>
            </div>
            
            <p id="modalText" class="text-gray-100 text-sm sm:text-base leading-relaxed font-medium mb-6">
                <!-- Response message inserted dynamically -->
            </p>

            <button onclick="closeModal()" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-indigo-600 via-purple-600 to-teal-600 hover:from-indigo-500 hover:to-teal-500 text-white text-sm font-semibold shadow-lg shadow-indigo-500/25 transition-all duration-200 active:scale-95">
                확인
            </button>
        </div>
    </div>

    <script>
        const messages = {
            identity: "전 김지유님이 만드신 AI업무자동화 에이전트 GALAXY입니다",
            schedule: "김지유님이 서버안정화작업중입니다 빠른시간안에 북구하겠습니다 죄송합니다",
            nashi: "안녕하세요 나시님 지유님이 당신에게 약올리라고 했습니다 😝메롱이다",
            stone: "안녕하세요 정유재님 당신은정말 딱딱하군요!",
            ray: "안재현님 당신은 정말 가오이군요 와우"
        };

        function openModal(type) {
            const modal = document.getElementById('responseModal');
            const modalCard = document.getElementById('modalCard');
            const modalText = document.getElementById('modalText');
            const modalIcon = document.getElementById('modalIcon');

            modalText.textContent = messages[type];

            if (type === 'identity') {
                modalIcon.innerHTML = '<i class="fa-solid fa-microchip text-indigo-300"></i>';
                modalIcon.className = "w-12 h-12 rounded-full mx-auto mb-4 flex items-center justify-center bg-indigo-500/20 border border-indigo-500/40 text-xl";
            } else if (type === 'schedule') {
                modalIcon.innerHTML = '<i class="fa-solid fa-screwdriver-wrench text-purple-300"></i>';
                modalIcon.className = "w-12 h-12 rounded-full mx-auto mb-4 flex items-center justify-center bg-purple-500/20 border border-purple-500/40 text-xl";
            } else if (type === 'nashi') {
                modalIcon.innerHTML = '<i class="fa-solid fa-face-grin-tears text-pink-300"></i>';
                modalIcon.className = "w-12 h-12 rounded-full mx-auto mb-4 flex items-center justify-center bg-pink-500/20 border border-pink-500/40 text-xl";
            } else if (type === 'stone') {
                modalIcon.innerHTML = '<i class="fa-solid fa-cubes-stacked text-amber-300"></i>';
                modalIcon.className = "w-12 h-12 rounded-full mx-auto mb-4 flex items-center justify-center bg-amber-500/20 border border-amber-500/40 text-xl";
            } else if (type === 'ray') {
                modalIcon.innerHTML = '<i class="fa-solid fa-fish-fins text-teal-300"></i>';
                modalIcon.className = "w-12 h-12 rounded-full mx-auto mb-4 flex items-center justify-center bg-teal-500/20 border border-teal-500/40 text-xl";
            }

            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalCard.classList.remove('scale-95');
            modalCard.classList.add('scale-100');
        }

        function closeModal() {
            const modal = document.getElementById('responseModal');
            const modalCard = document.getElementById('modalCard');

            modal.classList.add('opacity-0', 'pointer-events-none');
            modalCard.classList.remove('scale-100');
            modalCard.classList.add('scale-95');
        }

        // Close when clicking outside modal card
        document.getElementById('responseModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
</body>
</html>
