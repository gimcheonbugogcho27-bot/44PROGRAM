<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서비스 이용 제한 안내</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 transition-colors duration-300">

    <div class="w-full max-w-md bg-white dark:bg-slate-900 shadow-2xl rounded-3xl border border-slate-100 dark:border-slate-800 p-8 text-center relative overflow-hidden transition-all duration-300">
        
        <!-- Top decorative gradient bar -->
        <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-red-500 via-rose-500 to-amber-500"></div>

        <!-- Theme Toggle Button -->
        <div class="absolute top-4 right-4">
            <button onclick="toggleDarkMode()" aria-label="다크모드 전환" class="p-2.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition">
                <i id="theme-icon" class="fa-solid fa-moon text-sm"></i>
            </button>
        </div>

        <!-- Warning Icon Container -->
        <div class="w-20 h-20 mx-auto mb-6 bg-red-50 dark:bg-red-950/50 rounded-full flex items-center justify-center border border-red-100 dark:border-red-900/50 shadow-inner">
            <i class="fa-solid fa-triangle-exclamation text-3xl text-red-500 dark:text-red-400 animate-pulse"></i>
        </div>

        <!-- Title & Subtitle -->
        <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white mb-2">
            서비스 이용이 제한되었습니다
        </h1>
        <p class="text-sm text-slate-500 dark:text-slate-400 mb-6 leading-relaxed">
            보안 정책 위반 또는 이용약관에 의거하여<br>현재 해당 계정 또는 IP에서의 서비스 접근이 차단되었습니다.
        </p>

        <!-- Details Card -->
        <div class="bg-slate-50 dark:bg-slate-800/50 rounded-2xl p-4 mb-6 text-left border border-slate-100 dark:border-slate-800 text-xs space-y-2">
            <div class="flex justify-between">
                <span class="text-slate-400 font-medium">제한 사유:</span>
                <span class="text-slate-700 dark:text-slate-300 font-semibold">비정상적인 접근 시도 감지</span>
            </div>
            <div class="flex justify-between">
                <span class="text-slate-400 font-medium">오류 코드:</span>
                <span class="text-slate-700 dark:text-slate-300 font-mono font-semibold">ERR_ACCESS_DENIED_403</span>
            </div>
            <div class="flex justify-between">
                <span class="text-slate-400 font-medium">발생 일시:</span>
                <span id="timestamp" class="text-slate-700 dark:text-slate-300 font-mono">2026-06-06 00:00:00</span>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="space-y-3">
            <button onclick="handleSupportClick()" class="w-full py-3.5 px-4 bg-slate-900 hover:bg-slate-800 dark:bg-white dark:hover:bg-slate-100 dark:text-slate-900 text-white font-medium rounded-xl shadow-lg shadow-slate-900/10 dark:shadow-none transition duration-200 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-headset text-sm"></i>
                <span>고객센터 문의하기</span>
            </button>
            <button onclick="handleHomeClick()" class="w-full py-3.5 px-4 bg-transparent hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-400 font-medium rounded-xl transition duration-200 border border-slate-200 dark:border-slate-700">
                메인 페이지로 이동
            </button>
        </div>

        <!-- Footer Help Text -->
        <p class="text-xs text-slate-400 dark:text-slate-500 mt-6">
            본 조치가 부당하다고 생각되시면 고객센터로 문의해 주세요.
        </p>

    </div>

    <!-- Custom Notification Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-900 dark:bg-slate-800 text-white text-xs px-4 py-2.5 rounded-xl shadow-xl opacity-0 transition-opacity duration-300 pointer-events-none">
        안내 센터로 이동합니다...
    </div>

    <script>
        // Set dynamic current timestamp
        function updateTimestamp() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('timestamp').innerText = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        }
        updateTimestamp();

        // Dark mode toggle functionality
        function toggleDarkMode() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            html.classList.toggle('dark');
            if (html.classList.contains('dark')) {
                icon.className = "fa-solid fa-sun text-sm text-amber-400";
            } else {
                icon.className = "fa-solid fa-moon text-sm text-slate-600";
            }
        }

        // Auto check system preference for dark mode on load
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
            document.getElementById('theme-icon').className = "fa-solid fa-sun text-sm text-amber-400";
        }

        // Show interactive notification (no alert used)
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2500);
        }

        function handleSupportClick() {
            showToast('고객센터 페이지로 이동합니다.');
            // location.href = '/support'; // 실제 연결시 주석 해제
        }

        function handleHomeClick() {
            showToast('메인 페이지로 이동합니다.');
            // location.href = '/'; // 실제 연결시 주석 해제
        }
    </script>
</body>
</html>
