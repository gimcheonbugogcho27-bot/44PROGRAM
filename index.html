<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI GALAXY - 서비스 안내</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: #0b0f19;
            background-image: 
                radial-gradient(at 10% 10%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            display: flex;
            gap: 24px;
            max-width: 1000px;
            width: 100%;
            flex-wrap: wrap;
        }

        .card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            flex: 1 1 450px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .notice-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 20px;
            width: fit-content;
        }

        .notice-badge::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.5;
            color: #ffffff;
            margin-bottom: 24px;
            word-break: keep-all;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e5e7eb;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
            color: #ffffff;
        }

        /* 춤추는 고양이 패널 */
        .cat-panel {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 32px;
            flex: 1 1 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            min-height: 400px;
        }

        .cat-container {
            position: relative;
            width: 160px;
            height: 160px;
            margin-bottom: 20px;
        }

        .cat-disco-glow {
            position: absolute;
            width: 180px;
            height: 180px;
            top: -10px;
            left: -10px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.4) 0%, rgba(59, 130, 246, 0.1) 70%, transparent 100%);
            animation: disco 2s infinite alternate;
        }

        @keyframes disco {
            0% { transform: scale(0.9); opacity: 0.5; filter: hue-rotate(0deg); }
            100% { transform: scale(1.15); opacity: 0.9; filter: hue-rotate(360deg); }
        }

        .cat-svg {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
            animation: dance 0.6s ease-in-out infinite alternate;
            transform-origin: bottom center;
        }

        @keyframes dance {
            0% { transform: translateY(0) rotate(-6deg) scaleY(0.95); }
            100% { transform: translateY(-12px) rotate(6deg) scaleY(1.05); }
        }

        .left-paw {
            animation: wave-left 0.3s ease-in-out infinite alternate;
            transform-origin: 35px 85px;
        }

        .right-paw {
            animation: wave-right 0.3s ease-in-out infinite alternate-reverse;
            transform-origin: 125px 85px;
        }

        @keyframes wave-left {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-35deg); }
        }

        @keyframes wave-right {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(35deg); }
        }

        .music-note {
            position: absolute;
            font-size: 20px;
            opacity: 0;
            z-index: 3;
            animation: float-note 2s infinite linear;
        }

        .note1 { top: 10px; left: 10px; animation-delay: 0s; }
        .note2 { top: 20px; right: 10px; animation-delay: 0.7s; }
        .note3 { top: 50px; left: -10px; animation-delay: 1.4s; }

        @keyframes float-note {
            0% { opacity: 0; transform: translateY(10px) scale(0.8); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-40px) scale(1.2) rotate(20deg); }
        }

        .cat-title {
            font-weight: 700;
            font-size: 1.2rem;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .cat-sub {
            font-size: 0.875rem;
            color: #9ca3af;
        }

        /* 모달 팝업 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: rgba(23, 31, 50, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 28px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: scale(0.9);
            transition: transform 0.25s ease;
            text-align: center;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #f3f4f6;
            margin-bottom: 24px;
            word-break: keep-all;
            white-space: pre-wrap;
        }

        .modal-close-btn {
            background: #6366f1;
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .modal-close-btn:hover {
            background: #4f46e5;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 기존 메인 카드 -->
        <div class="card">
            <div>
                <div class="notice-badge">서비스이용이 제한됩니다</div>
                <h1>안녕하세요저는 김지유님의 AI GALAXY입니다 서버다운으로 불편을드려 죄송합니다 빠른시간안에 북구하겠습니다 김지유GALAXY AI</h1>
            </div>

            <div class="btn-group">
                <button class="btn" onclick="openModal('전김지유님이 제작하신 AI에이전트 GALAXY입니다')">
                    <span>넌 누구야</span>
                    <span>🤖</span>
                </button>
                <button class="btn" onclick="openModal('김지유님이 서버 안정화작업 중입니다 이용에 불편을 드려 죄송합니다')">
                    <span>언제쯤 돌아와</span>
                    <span>⏳</span>
                </button>
                <button class="btn" onclick="openModal('나시님 김지유님이 당신을 약올리라고 했습니다 😝메롱이다 ㅋㅋ')">
                    <span>나시</span>
                    <span>😜</span>
                </button>
                <button class="btn" onclick="openModal('안녕하세요 정유재님 당신은 정말 딱딱하군요')">
                    <span>돌맹이</span>
                    <span>🪨</span>
                </button>
                <button class="btn" onclick="openModal('안재현님 안녕하세요 당신은 정말 가오이군요 와우!!!')">
                    <span>가오리</span>
                    <span>🌊</span>
                </button>
            </div>
        </div>

        <!-- 신나게 춤추는 고양이 패널 -->
        <div class="cat-panel">
            <div class="cat-container">
                <div class="cat-disco-glow"></div>
                <div class="music-note note1">🎵</div>
                <div class="music-note note2">🎶</div>
                <div class="music-note note3">✨</div>
                <svg class="cat-svg" viewBox="0 0 160 160">
                    <!-- 귀 -->
                    <polygon points="45,45 30,15 65,35" fill="#f472b6" />
                    <polygon points="115,45 130,15 95,35" fill="#f472b6" />
                    <polygon points="48,42 37,20 62,35" fill="#fbcfe8" />
                    <polygon points="112,42 123,20 98,35" fill="#fbcfe8" />
                    
                    <!-- 얼굴 & 몸통 -->
                    <ellipse cx="80" cy="65" rx="45" ry="35" fill="#f472b6" />
                    <path d="M 50 85 Q 80 75 110 85 L 120 140 Q 80 150 40 140 Z" fill="#f472b6" />
                    <ellipse cx="80" cy="115" rx="25" ry="20" fill="#fbcfe8" />

                    <!-- 눈 -->
                    <ellipse cx="65" cy="60" rx="5" ry="7" fill="#1f2937" />
                    <ellipse cx="95" cy="60" rx="5" ry="7" fill="#1f2937" />
                    <circle cx="63" cy="58" r="2" fill="#ffffff" />
                    <circle cx="93" cy="58" r="2" fill="#ffffff" />

                    <!-- 볼터치 & 코/입 -->
                    <ellipse cx="55" cy="68" rx="6" ry="4" fill="#f43f5e" opacity="0.6" />
                    <ellipse cx="105" cy="68" rx="6" ry="4" fill="#f43f5e" opacity="0.6" />
                    <polygon points="80,66 77,70 83,70" fill="#9f1239" />
                    <path d="M 77 72 Q 80 75 83 72" stroke="#9f1239" stroke-width="2" fill="none" />

                    <!-- 수염 -->
                    <line x1="30" y1="60" x2="48" y2="63" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
                    <line x1="28" y1="70" x2="48" y2="68" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
                    <line x1="130" y1="60" x2="112" y2="63" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
                    <line x1="132" y1="70" x2="112" y2="68" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

                    <!-- 춤추는 앞발 -->
                    <ellipse class="left-paw" cx="35" cy="85" rx="10" ry="16" fill="#f472b6" />
                    <ellipse class="right-paw" cx="125" cy="85" rx="10" ry="16" fill="#f472b6" />
                </svg>
            </div>
            <div class="cat-title">복구 작업 진행 중...</div>
            <div class="cat-sub">고양이가 신나게 댄스를 추며 서버 복구를 응원하고 있습니다! 🐾</div>
        </div>
    </div>

    <!-- 공통 모달 팝업 -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
        <div class="modal-content">
            <div class="modal-text" id="modalText"></div>
            <button class="modal-close-btn" onclick="closeModal()">확인</button>
        </div>
    </div>

    <script>
        function openModal(text) {
            document.getElementById('modalText').innerText = text;
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function closeModalOnOverlay(event) {
            if (event.target === document.getElementById('modalOverlay')) {
                closeModal();
            }
        }
    </script>
</body>
</html>
